name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r demo _site/demo
          cp -r dist _site/dist
          printf '%s' '<!doctype html><meta charset="utf-8"><title>sysml2-mermaid</title><meta http-equiv="refresh" content="0; url=./demo/"><p><a href="./demo/">Open the sysml2-mermaid demo</a></p>' > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Prune old Pages deployments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Keep only the newest deployment in the github-pages environment.
          repo="${GITHUB_REPOSITORY}"
          ids=$(gh api "repos/$repo/deployments?environment=github-pages&per_page=100" \
            --jq 'sort_by(.created_at) | reverse | .[1:] | .[].id')
          for id in $ids; do
            gh api --method POST "repos/$repo/deployments/$id/statuses" -f state=inactive >/dev/null 2>&1 || true
            gh api --method DELETE "repos/$repo/deployments/$id" >/dev/null 2>&1 || true
          done
