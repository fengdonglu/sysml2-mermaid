<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>sysml2-mermaid — SysML v2 图表演示</title>
  <link rel="stylesheet" href="./demo.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-actions">
      <a href="./index.html" hreflang="en">English</a>
      <a class="repo-link" href="https://github.com/fengdonglu/sysml2-mermaid" aria-label="GitHub repository" title="GitHub repository">
        <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        <span>fengdonglu/sysml2-mermaid</span>
      </a>
    </div>
    <h1>sysml2-mermaid</h1>
    <p class="tagline">将 SysML v2 文本模型渲染为图表——Mermaid 插件或命令行。 <a href="./playground.zh.html">试试 SysML Playground →</a></p>
    <nav id="toc" aria-label="示例"></nav>
  </header>
  <main id="examples"></main>
  <script type="importmap">{"imports":{"mermaid":"https://cdn.jsdelivr.net/npm/mermaid@12/dist/mermaid.esm.min.mjs"}}</script>
  <script type="module">
    import mermaid from 'mermaid';
    import { registerSysml } from '../dist/sysml2-mermaid.mjs';
    import examples from './examples.zh.mjs';
    import { highlightSysml } from './highlight.mjs';

    // 在任何 await 之前关闭自动运行，避免 mermaid 在 DOMContentLoaded 时处理空的 .mermaid 块。
    mermaid.initialize({ startOnLoad: false });
    await registerSysml();

    const toc = document.getElementById('toc');
    const main = document.getElementById('examples');

    for (let i = 0; i < examples.length; i++) {
      const ex = examples[i];
      const num = String(i + 1).padStart(2, '0');

      const link = document.createElement('a');
      link.href = `#ex-${ex.id}`;
      link.textContent = `${num} · ${ex.title}`;
      toc.appendChild(link);

      const section = document.createElement('section');
      section.className = 'example';
      section.id = `ex-${ex.id}`;
      section.innerHTML =
        '<div class="panel source">' +
          `<h2><span class="num">${num}</span> ${escapeHtml(ex.title)}</h2>` +
          `<p class="explanation">${escapeHtml(ex.explanation)}</p>` +
          '<pre><code class="sysml"></code></pre>' +
        '</div>' +
        '<div class="panel output">' +
          '<div class="diagram"></div>' +
        '</div>';
      main.appendChild(section);
      ex._section = section;
    }

    function syncScrollOffset() {
      const offset = document.querySelector('.site-header').offsetHeight + 12;
      for (const section of main.children) section.style.scrollMarginTop = `${offset}px`;
    }
    syncScrollOffset();
    window.addEventListener('resize', syncScrollOffset);

    function escapeHtml(s) {
      return s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
    }

    async function render(ex) {
      const section = ex._section;
      const codeEl = section.querySelector('.sysml');
      const diagram = section.querySelector('.diagram');
      try {
        const source = await (await fetch(`./samples/${ex.sample}`)).text();
        codeEl.innerHTML = highlightSysml(source.trim());
        const { svg } = await mermaid.render(`s2m-zh-${ex.id}`, source);
        diagram.innerHTML = svg;
      } catch (e) {
        diagram.innerHTML = '<p class="error"></p>';
        diagram.querySelector('.error').textContent = String(e.message || e);
      }
    }

    for (const ex of examples) render(ex);
  </script>
</body>
</html>
